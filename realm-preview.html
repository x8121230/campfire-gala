<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>星芽營地場景預覽</title>
  <style>html,body,#camp{margin:0;width:100%;height:100%;overflow:hidden;background:#173e37}</style>
</head>
<body>
  <main id="camp"></main>
  <script type="module">
    import { RealmApp } from './src/realm/RealmApp.js';
    const root = document.querySelector('#camp');
    const app = new RealmApp(root, {
      onTravel: (target) => {
        if (target === 'hills') window.location.assign('./dandelion-hills-preview.html');
      }
    });
    app.start();
    window.addEventListener('beforeunload', () => app.dispose(), { once: true });
  </script>
</body>
</html>
