<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>幻界・星芽谷｜繪本版 v0.7</title><style>body{margin:0;background:#172b45;color:#fff0d5;font:18px sans-serif}#choose{position:fixed;inset:0;display:grid;place-content:center;gap:18px;text-align:center}#choose button{font:inherit;color:#fff0d5;background:#3e716e;border:1px solid #c8d6b9;border-radius:18px;padding:16px 28px;cursor:pointer}</style></head><body><main id="choose"><h1>幻界・星芽谷｜繪本版</h1><p>星之森與月亮湖 · 橫向冒險 · 進度自動保存</p><button id="paper">開始繪本冒險</button><p id="status"></p></main><script type="module">
const menu=document.getElementById('choose');let app=null,ctx=null;
function tone(name){try{ctx??=new AudioContext();if(ctx.state==='suspended')ctx.resume();const t=ctx.currentTime;for(let i=0;i<(name==='finish'?3:1);i++){const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=(name==='pop'?640:name==='correct'?880:520)*(1+i*.25);g.gain.setValueAtTime(0,t+i*.11);g.gain.linearRampToValueAtTime(.06,t+i*.11+.015);g.gain.exponentialRampToValueAtTime(.001,t+i*.11+.22);o.connect(g).connect(ctx.destination);o.start(t+i*.11);o.stop(t+i*.11+.25);}}catch{}}
function leave(){app?.dispose();app=null;menu.style.display='grid';}
async function mount(){leave();menu.style.display='none';const root=document.body.appendChild(document.createElement('div'));try{const {AdventureApp}=await import('./src/adventure/AdventureApp.js');app=new AdventureApp(root,{onExit:leave,onSound:tone});await app.start();}catch(e){console.error(e);root.remove();menu.style.display='grid';document.getElementById('status').textContent='請由網站伺服器開啟本頁，並保留完整素材資料夾。';}}
document.getElementById('paper').onclick=()=>{tone('hint');mount();};
</script></body></html>
