<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>始祖鳥逐格與琥珀重砲</title><style>body{margin:0;background:#183d45;color:#fff1cc;font:18px system-ui}main{max-width:1100px;margin:auto;padding:24px}select,button{font:inherit;padding:10px;border:1px solid #c8ab77;border-radius:12px;background:#fff1d5;color:#30473a;margin:5px}canvas{width:100%;background:radial-gradient(ellipse,#527581,#182f48);border-radius:20px}p{line-height:1.6}</style><main><h1>始祖鳥｜逐格動作與琥珀重砲</h1><p>40 格機體動作＋12 格彈藥特效。選擇動作，可暫停逐格檢視。</p><select id="state"></select><button id="pause">暫停</button><button id="step">下一格</button><canvas id="c" width="1100" height="520"></canvas><p id="label"></p><p>解壓後直接開啟此頁。保留原造型的孔雀眼長尾、藤葉肩甲與琥珀飾品。右方循環展示重砲彈、爆裂震盪與追加彈。出擊、陣亡及大招在此循環展示。</p></main><script>const anchors={"cruise": [[0.76, 0.71], [0.76, 0.71], [0.76, 0.71], [0.76, 0.71], [0.77, 0.63], [0.77, 0.63], [0.77, 0.63], [0.77, 0.63]], "maneuver": [[0.77, 0.64], [0.77, 0.64], [0.77, 0.64], [0.77, 0.64], [0.78, 0.55], [0.78, 0.58], [0.75, 0.47], [0.76, 0.48]], "combat": [[0.7, 0.52], [0.68, 0.54], [0.72, 0.55], [0.75, 0.56], [0.7, 0.5], [0.7, 0.53], [0.61, 0.49], [0.73, 0.5]], "burst-fall": [[0.57, 0.4], [0.72, 0.5], [0.62, 0.44], [0.78, 0.4], [0.56, 0.42], [0.69, 0.44], [0.59, 0.49], [0.77, 0.43]], "arrival": [[0.73, 0.69], [0.7, 0.55], [0.65, 0.52], [0.66, 0.5], [0.74, 0.43], [0.65, 0.47], [0.7, 0.44], [0.75, 0.4]]};
const states={巡航:['cruise',[0,1,2,3,4,5,6,7],10],後退:['maneuver',[0,1,2,3],10],上傾:['maneuver',[4,5],10],下傾:['maneuver',[6,7],10],受擊:['combat',[0,1],8],衝刺:['combat',[2,3],12],攻擊:['combat',[4,5,6,7],10],蓄勢:['burst-fall',[0,1],6],大招:['burst-fall',[0,1,2,3],4],陣亡:['burst-fall',[4,5,6,7],4],出擊:['arrival',[0,1,2,3],6],勝利:['arrival',[4,5,6,7],6]};
const ims={},c=document.querySelector('#c'),ctx=c.getContext('2d'),sel=document.querySelector('#state');let time=0,paused=false,last=0;
for(const name in states)sel.add(new Option(name,name));
for(const key of new Set([...Object.values(states).map(s=>s[0]),'ammo'])){const im=new Image;im.src='assets/forest-starflight/animation-v0129/'+key+'.png';ims[key]=im;im.onerror=()=>document.querySelector('#label').textContent='素材讀取失敗，請確認 assets 資料夾與此頁在同一層。';}
sel.onchange=()=>time=0;document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'播放':'暫停';};document.querySelector('#step').onclick=()=>{paused=true;time+=1/states[sel.value][2];document.querySelector('#pause').textContent='播放';};
function draw(key,f,x,y,w,anchor){const im=ims[key];if(!im?.naturalWidth)return;const cols=4,rows=key==='ammo'?3:2,sx=Math.round(f%cols*im.width/cols),sy=Math.round(Math.floor(f/cols)*im.height/rows),sw=Math.round((f%cols+1)*im.width/cols)-sx,sh=Math.round((Math.floor(f/cols)+1)*im.height/rows)-sy,h=w*sh/sw,a=anchor||anchors[key]?.[f]||[.62,.6];ctx.drawImage(im,sx,sy,sw,sh,x-w*a[0],y-h*a[1],w,h);}
function loop(now){if(!paused)time+=Math.min(.05,(now-last)/1000||0);last=now;ctx.clearRect(0,0,1100,520);const [key,seq,fps]=states[sel.value],idx=Math.floor(time*fps)%seq.length;draw(key,seq[idx],270,265,320);ctx.fillStyle='#e8f8ff';ctx.font='18px system-ui';ctx.fillText('重砲彈 → 爆裂震盪 → 追加彈',510,105);draw('ammo',Math.floor(time*16)%4,580,220,130,[.5,.5]);draw('ammo',4+Math.floor(time*7)%4,830,220,190,[.5,.5]);draw('ammo',8+Math.floor(time*16)%4,940,390,100,[.5,.5]);document.querySelector('#label').textContent=sel.value+'　影格 '+(idx+1)+' / '+seq.length;requestAnimationFrame(loop);}requestAnimationFrame(loop);
</script>
