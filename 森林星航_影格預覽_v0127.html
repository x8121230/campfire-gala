<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>森林星航｜貓頭鷹影格預覽</title><style>body{margin:0;background:#183d45;color:#fff1cc;font:18px system-ui}main{max-width:1100px;margin:auto;padding:24px}h1{font-size:28px}select,button{font:inherit;padding:10px;border:1px solid #c8ab77;border-radius:12px;background:#fff1d5;color:#30473a;margin:5px}canvas{background:radial-gradient(ellipse at center,#527581,#182f48);width:100%;border-radius:20px}p{line-height:1.6}small{color:#cbdddd}</style><main><h1>旋羽貓頭鷹 × 風鈴毒蕈菇</h1><p>44 格貓頭鷹動作＋8 格毒蕈菇動作。可選擇動作、暫停並逐格檢查。</p><select id="state"></select><select id="enemy"><option value="idle">毒蕈菇・飄動</option><option value="attack">毒蕈菇・蓄勢吐孢子</option><option value="fall">毒蕈菇・消散</option></select><button id="pause">暫停</button><button id="step">下一格</button><canvas id="c" width="1100" height="520"></canvas><p id="label"></p><small>請先解壓縮，與 assets 資料夾放在同一層後開啟。此頁循環展示動作；遊戲中的陣亡、大招與出擊只播放一次。</small></main><script>
const anchors={
 'owl-attack':[[370,430],[255,440],[380,390],[370,395]],
 'owl-cruise':[[285,305],[285,305],[285,305],[285,305],[285,275],[285,275],[285,275],[285,275]],
 'owl-maneuver':[[270,285],[275,285],[275,285],[285,285],[270,275],[275,275],[270,275],[275,275]],
 'owl-combat':[[210,290],[210,290],[255,290],[255,290],[220,270],[220,270],[160,250],[250,275]],
 'owl-burst-fall':[[210,295],[220,295],[235,295],[260,295],[235,250],[235,250],[225,250],[225,250]],
 'owl-arrival':[[280,280],[280,295],[270,290],[280,280],[265,275],[275,270],[275,250],[270,245]]
};
const states={巡航:['owl-cruise',[0,1,2,3,4,5,6,7],12],後退:['owl-maneuver',[0,1,2,3],10],向上傾斜:['owl-maneuver',[4,5],8],向下傾斜:['owl-maneuver',[6,7],8],普攻:['owl-attack',[0,1,2,3],10],受擊:['owl-combat',[0,1],8],衝刺:['owl-combat',[2,3],10],四向旋羽:['owl-combat',[4,5,6,7],8],大招:['owl-burst-fall',[0,1,2,3],4.44],陣亡:['owl-burst-fall',[4,5,6,7],4],出擊:['owl-arrival',[0,1,2,3],4],勝利:['owl-arrival',[4,5,6,7],5.55]};
const sel=document.getElementById('state'),enemy=document.getElementById('enemy'),canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),imgs={};for(const k of Object.keys(states))sel.add(new Option(k,k));
let tick=0,paused=false,last=performance.now();document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'播放':'暫停'};document.getElementById('step').onclick=()=>{paused=true;tick+=1/states[sel.value][2];document.getElementById('pause').textContent='播放'};sel.onchange=()=>tick=0;
for(const k of [...new Set(Object.values(states).map(v=>v[0])),'mushroom']){const im=new Image();im.src='assets/forest-starflight/animation-v0127/'+k+'.png';imgs[k]=im;im.onerror=()=>document.getElementById('label').textContent='找不到素材，請確認 assets 資料夾與此頁在同一層。';}
function draw(k,f,x,y,width){const im=imgs[k];if(!im.complete||!im.naturalWidth)return;const cols=k==='owl-attack'?2:4;const sx=Math.round(f%cols*im.width/cols),sy=Math.round(Math.floor(f/cols)*im.height/2),w=Math.round((f%cols+1)*im.width/cols)-sx,h=Math.round((Math.floor(f/cols)+1)*im.height/2)-sy,a=anchors[k]?.[f]||[w*.5,h*.5],z=width/w;ctx.drawImage(im,sx,sy,w,h,x-a[0]*z,y-a[1]*z/1.27,w*z,h*z/1.27);}
function loop(now){if(!paused)tick+=(now-last)/1000;last=now;ctx.clearRect(0,0,1100,520);const [k,frames,fps]=states[sel.value],f=frames[Math.floor(tick*fps)%frames.length],ef=enemy.value==='idle'?[0,1,2,3]:enemy.value==='attack'?[4,4,4,5,5]:[6,7];draw(k,f,360,310,430);draw('mushroom',ef[Math.floor(tick*6)%ef.length],850,270,260);ctx.fillStyle='#fff1cc';ctx.font='22px system-ui';ctx.fillText('旋羽貓頭鷹',215,455);ctx.fillText('風鈴毒蕈菇',765,455);document.getElementById('label').textContent=sel.value+'｜影格 '+(frames.indexOf(f)+1)+' / '+frames.length;requestAnimationFrame(loop);}requestAnimationFrame(loop);
</script>
