<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111111" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="森林益智樂園" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>森林益智樂園</title>
    <script src="./phaser.js"></script>
    <script type="module" src="./src/patches/GrassTransitionPatch.js"></script>
    <script type="module" src="./src/main.js?v=mobile-fullscreen100"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
            font-family: Arial, sans-serif;
            overscroll-behavior: none;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            width: var(--app-width, 100vw);
            height: var(--app-height, 100dvh);
            max-width: 100vw;
            max-height: 100dvh;
            overflow: hidden;
            position: relative;
            border: 3px solid #fff;
            box-sizing: border-box;
        }

        canvas {
            display: block;
        }

        #game-container:fullscreen,
        #game-container:-webkit-full-screen,
        html.mobile-web-fullscreen,
        body.mobile-web-fullscreen,
        #game-container.mobile-web-fullscreen {
            position: fixed;
            inset: 0;
            width: 100vw;
            width: 100dvw;
            height: 100vh;
            height: 100dvh;
            max-width: none;
            max-height: none;
            margin: 0;
            border: 0;
            background: #000;
        }

        html.mobile-web-fullscreen,
        body.mobile-web-fullscreen {
            overflow: hidden;
        }

        @media (hover: none), (pointer: coarse), (max-width: 900px) {
            #game-container {
                border: 0;
            }
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <script>
        (function syncInitialViewport() {
            var viewport = window.visualViewport;
            var root = document.documentElement;
            root.style.setProperty('--app-height', Math.round((viewport && viewport.height) || window.innerHeight) + 'px');
            root.style.setProperty('--app-width', Math.round((viewport && viewport.width) || window.innerWidth) + 'px');
        }());
    </script>
</body>
</html>
