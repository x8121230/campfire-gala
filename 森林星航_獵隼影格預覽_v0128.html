<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>獵隼逐格與貫穿雷射</title><style>body{margin:0;background:#183d45;color:#fff1cc;font:18px system-ui}main{max-width:1100px;margin:auto;padding:24px}select,button{font:inherit;padding:10px;border:1px solid #c8ab77;border-radius:12px;background:#fff1d5;color:#30473a;margin:5px}canvas{width:100%;background:radial-gradient(ellipse,#527581,#182f48);border-radius:20px}p{line-height:1.6}</style><main><h1>獵隼｜逐格動作與貫穿雷射</h1><p>40 格機體動作＋12 格雷射特效。選擇動作，可暫停逐格檢視。</p><select id="state"></select><button id="pause">暫停</button><button id="step">下一格</button><canvas id="c" width="1100" height="520"></canvas><p id="label"></p><p>解壓後直接開啟此頁。雷射示範向右穿透三個靶點；實際遊戲的貫穿數依能力等級計算。出擊、陣亡及大招在此循環展示。</p></main><script>const anchors={
 'falcon-cruise':[[.65,.76],[.65,.76],[.65,.76],[.65,.76],[.65,.68],[.65,.68],[.65,.68],[.65,.68]],
 'falcon-maneuver':Array.from({length:8},()=>[.64,.67]),
 'falcon-combat':[[.54,.63],[.57,.61],[.63,.56],[.63,.56],[.51,.61],[.52,.61],[.55,.65],[.57,.65]],
 'falcon-burst':[[.63,.65],[.65,.67],[.63,.56],[.65,.55]],
 'falcon-fall':[[.60,.57],[.62,.60],[.58,.55],[.65,.56]]
};

const states={巡航:['falcon-cruise',[0,1,2,3,4,5,6,7],14],後退:['falcon-maneuver',[0,1,2,3],10],上傾:['falcon-maneuver',[4,5],10],下傾:['falcon-maneuver',[6,7],10],受擊:['falcon-combat',[0,1],8],衝刺:['falcon-combat',[2,3],12],攻擊:['falcon-combat',[4,5,6,7],10],蓄勢:['falcon-burst',[0,1],6],大招:['falcon-burst',[0,1,2,3],4],陣亡:['falcon-fall',[0,1,2,3],4],出擊:['falcon-arrival',[0,1,2,3],6],勝利:['falcon-arrival',[4,5,6,7],6]};
const ims={},c=document.querySelector('#c'),ctx=c.getContext('2d'),sel=document.querySelector('#state');let time=0,paused=false,last=0;
for(const name in states)sel.add(new Option(name,name));
for(const key of new Set([...Object.values(states).map(s=>s[0]),'laser-fx'])){const im=new Image;im.src='assets/forest-starflight/animation-v0128/'+key+'.png';ims[key]=im;im.onerror=()=>document.querySelector('#label').textContent='素材讀取失敗，請確認 assets 資料夾與此頁在同一層。';}
sel.onchange=()=>time=0;document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'播放':'暫停';};document.querySelector('#step').onclick=()=>{paused=true;time+=1/states[sel.value][2];document.querySelector('#pause').textContent='播放';};
function draw(key,f,x,y,w,anchor){const im=ims[key];if(!im?.naturalWidth)return;const cols=['falcon-burst','falcon-fall'].includes(key)?2:4,rows=key==='laser-fx'?3:2,sx=Math.round(f%cols*im.width/cols),sy=Math.round(Math.floor(f/cols)*im.height/rows),sw=Math.round((f%cols+1)*im.width/cols)-sx,sh=Math.round((Math.floor(f/cols)+1)*im.height/rows)-sy,h=w*sh/sw,a=anchor||anchors[key]?.[f]||[.62,.6];ctx.drawImage(im,sx,sy,sw,sh,x-w*a[0],y-h*a[1],w,h);}
function loop(now){if(!paused)time+=Math.min(.05,(now-last)/1000||0);last=now;ctx.clearRect(0,0,1100,520);const [key,seq,fps]=states[sel.value],idx=Math.floor(time*fps)%seq.length;draw(key,seq[idx],270,265,320);ctx.fillStyle='#e8f8ff';ctx.font='18px system-ui';ctx.fillText('連續貫穿',550,105);const bx=410+(time%2)/2*650;for(const x of [620,800,980]){ctx.strokeStyle='#7198a8';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,260,28,0,Math.PI*2);ctx.stroke();if(bx>=x&&bx-x<100)draw('laser-fx',8+Math.min(3,Math.floor((bx-x)/25)),x,260,105,[.5,.5]);}draw('laser-fx',Math.floor(time*24)%4,bx,260,190,[.7,.5]);draw('laser-fx',4+Math.floor(time*20)%4,415,260,85,[.5,.5]);document.querySelector('#label').textContent=sel.value+'　影格 '+(idx+1)+' / '+seq.length;requestAnimationFrame(loop);}requestAnimationFrame(loop);
</script>
