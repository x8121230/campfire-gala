const SOUVENIR_POINTS = Object.freeze({common:1, rare:2});
const LEVEL_REWARDS = Object.freeze(['damage','agility','maxHp','maxMana']);
function normalizeSouvenirs(value={}) {
 const result={};for(const [id,rarity] of Object.entries(value||{}))if(/^[\w-]{1,100}$/.test(id)&&Object.hasOwn(SOUVENIR_POINTS,rarity))result[id]=rarity;return result;
}
function souvenirProgress(value={}) {
 const souvenirs=normalizeSouvenirs(value);const points=Object.values(souvenirs).reduce((n,r)=>n+SOUVENIR_POINTS[r],0);
 let level=1,spent=0;while(points-spent>=level*5){spent+=level*5;level++;}
 const stats={damage:1,agility:0,maxHp:3,maxMana:3};for(let lv=2;lv<=level;lv++)stats[LEVEL_REWARDS[(lv-2)%4]]++;
 return {level,points,uniqueCount:Object.keys(souvenirs).length,intoLevel:points-spent,needed:level*5,...stats,moveMultiplier:1+stats.agility*.03};
}
function registerSouvenir(state,id,rarity) {
 if(!/^[\w-]{1,100}$/.test(id)||!Object.hasOwn(SOUVENIR_POINTS,rarity))return false;
 state.souvenirs=normalizeSouvenirs(state.souvenirs);if(Object.hasOwn(state.souvenirs,id))return false;
 state.souvenirs[id]=rarity;return true;
}

  const result = {};
  for (const [name, value] of Object.entries(items && typeof items === 'object' ? items : {})) {
    if (RETIRED_EQUIPMENT.has(name) || ['星光吹泡泡棒','魔法劍','魔法箭'].includes(name)) continue;
    const count = Math.max(0, Math.min(99, Math.floor(Number(value) || 0)));
    if (count) result[name] = ITEM_CATALOG[name]?.type === 'equipment' || ITEM_CATALOG[name]?.type === 'bead' ? Math.min(count, 99) : count;
  }
  return result;
}

function defaultStarsproutInventory() {
  return {
    v: 1, capacity: 24, maxCapacity: 60, gold: 0,
    items: {}, learnedSkills: [], rewardClaims: {}, quickSlots: ['', '', '', ''], souvenirs: {}, revision: 319,
    equipped: {}, retiredEquipment: {},
    beads: ['', '', ''], unlockedBeadSlots: 1
  };
}

function normalizeStarsproutInventory(value) {
  const base = defaultStarsproutInventory();
  if (!value || value.v !== 1) return base;
  const capacity = Math.max(24, Math.min(60, Math.floor(Number(value.capacity) / 6) * 6 || 24));
  const items = { ...base.items, ...cleanItems(value.items) };
  const equipped = { ...base.equipped };
  for (const [slot, name] of Object.entries(value.equipped || {})) if (slot === 'weapon' && name === '斬擊' && items[name]) equipped[slot] = name;
  const unlockedBeadSlots = Math.max(1, Math.min(3, Math.floor(Number(value.unlockedBeadSlots) || 1)));
  const beads = [0, 1, 2].map((index) => index < unlockedBeadSlots && items[value.beads?.[index]] && ITEM_CATALOG[value.beads[index]]?.type === 'bead' ? value.beads[index] : '');
  const retiredEquipment = { ...(value.retiredEquipment || {}) };
  for (const name of RETIRED_EQUIPMENT) if (Number(value.items?.[name]) > 0) retiredEquipment[name] = value.items[name];
  const learnedSkills = Array.isArray(value.learnedSkills) && value.learnedSkills.includes('slash') ? ['slash'] : [];
  if(learnedSkills.includes('slash')){items['斬擊']=1;equipped.weapon='斬擊';}else{delete items['斬擊'];delete equipped.weapon;}
  const quickSlots=[0,1,2,3].map(i=>ITEM_CATALOG[value.quickSlots?.[i]]?.type==='consumable'?value.quickSlots[i]:'');
  const rewardClaims={mentorSlash:value.rewardClaims?.mentorSlash===true};
  return { v: 1, revision:319, hillsInventoryMerged:value.hillsInventoryMerged===true, learnedSkills, rewardClaims, quickSlots, souvenirs:normalizeSouvenirs(value.souvenirs), retiredEquipment, capacity, maxCapacity: 60, gold: Math.max(0, Math.floor(Number(value.gold) || 0)), items, equipped, beads, unlockedBeadSlots };
}

function loadStarsproutInventory() {
  try { return normalizeStarsproutInventory(JSON.parse(localStorage.getItem(STARSPROUT_INVENTORY_SAVE) || 'null')); }
  catch { return defaultStarsproutInventory(); }
}

function saveStarsproutInventory(state) {
  const safe = normalizeStarsproutInventory(state);
  localStorage.setItem(STARSPROUT_INVENTORY_SAVE, JSON.stringify(safe));
  return safe;
}

function mergeStarsproutItems(state, incoming) {
  const safe = normalizeStarsproutInventory(state);
  for (const [name, count] of Object.entries(cleanItems(incoming))) safe.items[name] = Math.max(safe.items[name] || 0, count);
  return safe;
}

function sortedStarsproutItems(state, filter = 'all') {
  const safe = normalizeStarsproutInventory(state);
  return Object.entries(safe.items).filter(([, count]) => count > 0).map(([name, count]) => ({ name, count, ...(ITEM_CATALOG[name] || { icon: '🎒', type: 'material', rarity: 'common', level: 1, description: '在星芽谷旅途中取得的物品。' }) }))
    .filter((item) => filter === 'all' || item.type === filter)
    .sort((a, b) => (RARITY_ORDER[b.rarity] || 0) - (RARITY_ORDER[a.rarity] || 0) || a.type.localeCompare(b.type) || b.level - a.level || a.name.localeCompare(b.name, 'zh-Hant'));
}

function occupiedSlots(state) {
  return Object.entries(normalizeStarsproutInventory(state).items).reduce((sum, [name, count]) => sum + (['equipment', 'bead'].includes(ITEM_CATALOG[name]?.type) ? count : 1), 0);
}

function assignQuickItem(state,index,name){
 if(!Number.isInteger(index)||index<0||index>3)return false;
 if(name&&(ITEM_CATALOG[name]?.type!=='consumable'||!(state.items[name]>0)))return false;

 if(name!=='甜蘋果')return{used:false,message:name?'這個道具目前沒有可使用的效果。':'先在背包放入快捷道具。'};

 state.items[name]--;if(state.items[name]<=0)delete state.items[name];health.hp=Math.min(health.maxHp,health.hp+1);
 return{used:true,message:'甜蘋果 −1 · HP +1'};
}
function autoConsume(state,health,dt){
 health.itemUseCooldown=Math.max(0,(health.itemUseCooldown||0)-Math.max(0,dt||0));
 if(health.itemUseCooldown>0||!state.quickSlots.includes('甜蘋果'))return false;

    const footer=this.el('div','sprout-footer','',right);this.capacity=this.el('div','sprout-cap','',footer);this.quick=this.el('div','sprout-quick','',footer);this.button('整理行囊',()=>{this.selected='';this.render();this.detail.textContent='已依品質、類型與等級整理。';this.onNotice('行囊整理好了！');},footer);
  }
  render(){
    this.state=normalizeStarsproutInventory(this.state);this.beads.replaceChildren();
    const progress=souvenirProgress(this.state.souvenirs);this.progress.textContent=`Lv.${progress.level} · 紀念品 ${progress.uniqueCount} 件\n收藏進度 ${progress.intoLevel} / ${progress.needed} 點\n傷害 ${progress.damage} · 敏捷 ${progress.agility} · HP ${progress.maxHp} · SP ${progress.maxMana}`;
    this.quick.replaceChildren();
    for(let i=0;i<4;i++){const name=this.state.quickSlots[i];const slot=this.button('',()=>{if(ITEM_CATALOG[this.selected]?.type==='consumable'){this.assignQuick(i,this.selected);}else if(name){this.select(name);}else this.onNotice('先點選消耗道具，再點這個槽位。');},this.quick,'sprout-quick-slot');
      this.el('span','quick-key',String(i+1),slot);if(name)appendItemArt(slot,name);else this.el('span','quick-empty','＋',slot);this.el('span','quick-qty',name?String(this.state.items[name]||0):'放道具',slot);slot.title=name?`${name}｜點選查看使用與取下`:'點選或拖曳放入道具';
      slot.addEventListener('dragover',e=>e.preventDefault());slot.addEventListener('drop',e=>{e.preventDefault();this.assignQuick(i,e.dataTransfer.getData('text/plain'));});
    }
    for(let i=0;i<3;i++){
      const unlocked=i<this.state.unlockedBeadSlots,name=this.state.beads[i];
      const node=this.button('',()=>this.unequipBead(i),this.beads,`sprout-bead ${unlocked?'':'locked'}`);
      if(name)appendItemArt(node,name);else this.el('span','orb-symbol',unlocked?'◇':'⌑',node);
      this.el('span','',name?'取下':unlocked?'空槽':'未解鎖',node);node.title=name||'隨主線任務解鎖';
      node.addEventListener('dragover',e=>{if(unlocked)e.preventDefault();});node.addEventListener('drop',e=>{e.preventDefault();this.equip(e.dataTransfer.getData('text/plain'),i);});
    }
    for(const [type,button] of Object.entries(this.tabButtons))button.classList.toggle('active',type===this.filter);
    const items=sortedStarsproutItems(this.state,this.filter);this.grid.replaceChildren();
    for(let i=0;i<Math.max(this.state.capacity,items.length);i++){
      const item=items[i];if(!item){this.el('div','sprout-slot empty','',this.grid);continue;}
      const node=this.button('',()=>this.select(item.name),this.grid,`sprout-slot ${item.rarity} ${this.selected===item.name?'selected':''}`);
      node.title=item.name;appendItemArt(node,item.name);this.el('span','name',item.name,node);this.el('span','qty',String(item.count),node);
      if(item.name==='斬擊')this.el('span','badge','SP 0',node);
      node.draggable=item.type==='bead'||item.type==='consumable';node.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',item.name));
    }
    this.capacity.textContent=`${occupiedSlots(this.state)} / ${this.state.capacity} 格　｜　金幣 ${this.state.gold.toLocaleString('zh-TW')}`;
    if(this.selected)this.showDetail(this.selected);
  }
  showSkill(name){this.select(name);}
  showDetail(name){
    const item=ITEM_CATALOG[name];this.detail.replaceChildren();const text=this.el('div','sprout-detail-text','',this.detail);this.el('strong','',name,text);this.el('span','',item?.description||'星芽谷旅途中取得的冒險物品。',text);
    if(item?.type==='bead')this.button('裝備靈珠',()=>this.equip(name),this.detail);
    if(item?.type==='consumable'){
      this.button('使用',()=>{const result=this.onUse(name);if(result.state)this.state=result.state;this.onNotice(result.message);this.render();},this.detail);
      this.button('放入快捷欄',()=>{let i=this.state.quickSlots.indexOf('');if(i<0){this.onNotice('四個槽位已滿，請點下方想替換的槽位。');return;}this.assignQuick(i,name);},this.detail);
      if(this.state.quickSlots.includes(name))this.button('從快捷欄取下',()=>{this.state.quickSlots=this.state.quickSlots.map(n=>n===name?'':n);this.changed();},this.detail);
    }
  }
  assignQuick(index,name){if(assignQuickItem(this.state,index,name)){this.selected='';this.changed();this.detail.textContent='已放入快捷欄；蘋果會在缺少至少 1 HP 時自動食用。';}else this.onNotice('請放入已持有的消耗道具。');}
  select(name){this.selected=name;this.render();}
  equip(name,requestedIndex=-1){const item=ITEM_CATALOG[name];if(item?.type!=='bead'||!this.state.items[name])return;let index=requestedIndex;if(index<0)index=this.state.beads.findIndex((v,i)=>i<this.state.unlockedBeadSlots&&!v);if(index<0)index=0;if(index>=this.state.unlockedBeadSlots)return;this.state.beads[index]=name;this.changed();}
  unequipBead(index){if(index<this.state.unlockedBeadSlots&&this.state.beads[index]){this.state.beads[index]='';this.changed();}}
  changed(){this.state=normalizeStarsproutInventory(this.state);this.onChange(this.state);this.render();}
  close(){this.onClose(this.state);this.style.remove();this.overlay.remove();}
}

let state=mentorReward(defaultStarsproutInventory(),3),health={hp:3,maxHp:3},panel,automatic=true;const notice=t=>document.getElementById('notice').textContent=t;
const app={inventoryState:state,quickbar:document.getElementById('quickbar'),el(tag,cls,text,parent){const n=document.createElement(tag);n.className=cls;n.textContent=text;parent.append(n);return n;},button(text,fn,parent,cls){const n=this.el('button',cls,text,parent);n.onclick=fn;return n;},useQuick(i){use(state.quickSlots[i]);}};
function hud(){app.inventoryState=state;renderQuickSlots(app);document.getElementById('health').textContent='♥'.repeat(health.hp)+'♡'.repeat(health.maxHp-health.hp)+'　HP '+health.hp+'/'+health.maxHp;}
function use(name){const result=consumeItem(state,health,name);notice(result.message);hud();if(panel){panel.state=state;panel.render();}return {...result,state};}
function open(){document.getElementById('host').replaceChildren();panel=new StarsproutInventoryPanel(document.getElementById('host'),{state,onChange:s=>{state=s;hud();},onUse:use,onNotice:notice,onClose:()=>setTimeout(open,0)});}
app.quickSlots=buildQuickSlots(app);open();hud();document.getElementById('hurt').onclick=()=>{health.hp=Math.max(1,health.hp-1);hud();};document.getElementById('auto').onclick=e=>{automatic=!automatic;e.target.textContent='自動使用：'+(automatic?'開':'關');};document.getElementById('reset').onclick=()=>{state=mentorReward(defaultStarsproutInventory(),3);health={hp:3,maxHp:3};open();hud();notice('展示已重置。');};setInterval(()=>{if(automatic&&autoConsume(state,health,.1)){notice('自動食用：甜蘋果 −1 · HP +1');panel.state=state;panel.render();hud();}},100);
