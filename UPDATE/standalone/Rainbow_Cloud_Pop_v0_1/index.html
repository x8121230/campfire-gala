<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>啵啵彩虹雲朵 v0.1</title><link rel="stylesheet" href="styles.css"></head><body>
<main class="game-shell"><header class="topbar"><div class="title-wrap"><span class="logo">☁</span><h1>啵啵彩虹雲朵</h1><span class="version">v0.1 DEMO</span></div><div class="controls"><button id="freeBtn" type="button" aria-pressed="true">🫧 自由啵啵</button><button id="questBtn" type="button" aria-pressed="false">🌈 彩虹任務</button><button id="slowBtn" type="button" aria-pressed="false">🐢 慢慢玩</button><button id="soundBtn" type="button" aria-pressed="true">🔊 音效：開</button><button id="pauseBtn" type="button">⏸ 暫停</button></div></header>
<section class="stage"><canvas id="game" width="960" height="540" tabindex="0" aria-label="點擊雲朵，讓雲朵變色並降下星星、糖果或花瓣"></canvas><div class="hud"><div class="pill" id="modeText">自由啵啵：想點哪朵都可以</div><div class="pill">啵啵 <strong id="popText">0</strong></div></div>
<div id="startPanel" class="panel show"><div class="mascot">☁️</div><h2>輕輕點一下雲朵！</h2><p>每朵雲都會「啵」一聲、變換顏色，再灑下閃亮驚喜。</p><div class="howto"><div><span>☝️</span><b>點雲朵</b></div><div><span>🎨</span><b>看它變色</b></div><div><span>⭐</span><b>接住驚喜</b></div></div><button id="startBtn" class="primary" type="button">開始啵啵</button></div>
<div id="pausePanel" class="panel compact" aria-hidden="true"><div class="mascot">💤</div><h2>雲朵休息中</h2><p>準備好再繼續玩。</p><button id="resumeBtn" class="primary" type="button">繼續啵啵</button></div>
</section><footer><span>自由模式沒有目標、沒有失敗，想玩多久都可以</span><span>彩虹任務：依上方顏色順序點雲朵</span><button id="restartBtn" type="button">↻ 清空重玩</button></footer></main><script src="game.js"></script></body></html>
