<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>天空快遞隊 v0.1</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="game-shell" aria-label="天空快遞隊遊戲"><header class="topbar"><div class="title-wrap"><span class="plane">➤</span><h1>天空快遞隊</h1><span class="version">v0.1 DEMO</span></div><div class="controls"><button id="toddlerBtn" type="button" aria-pressed="false">👶 幼幼模式</button><button id="slowBtn" type="button" aria-pressed="false">🐢 慢慢玩</button><button id="hintBtn" type="button" aria-pressed="false">✨ 提示</button><button id="soundBtn" type="button" aria-pressed="true">🔊 音效：開</button><button id="pauseBtn" type="button">⏸ 暫停</button></div></header>
<section class="stage-wrap"><canvas id="game" width="960" height="540" tabindex="0" aria-label="先選包裹，再選正確的天空目的地"></canvas><div class="hud"><div class="pill" id="stageText">第一階段：看圖案</div><div class="progress"><span id="progressBar"></span></div><div class="pill">任務 <strong id="roundText">1 / 12</strong></div></div>
<div id="startPanel" class="panel show"><div class="mascot">📦</div><h2>把包裹送到正確的浮島！</h2><div class="howto"><div><span>📦</span><b>先點包裹</b></div><div><span>👀</span><b>比對標記</b></div><div><span>🏝️</span><b>再點浮島</b></div></div><p>幼幼模式只要點目的地，飛船會自動幫忙。</p><button id="startBtn" class="primary" type="button">開始配送</button></div>
<div id="stagePanel" class="panel compact" aria-hidden="true"><div id="stageIcon" class="mascot">📮</div><h2 id="stageTitle"></h2><p id="stageHelp"></p><button id="stageBtn" class="primary" type="button">開始這一段</button></div><div id="pausePanel" class="panel compact" aria-hidden="true"><div class="mascot">☁️</div><h2>飛船暫停了</h2><p>準備好再繼續配送。</p><button id="resumeBtn" class="primary" type="button">繼續配送</button></div><div id="finishPanel" class="panel compact" aria-hidden="true"><div class="mascot">🎉</div><h2>雲端島嶼配送完成！</h2><p>五段天空冒險都連在一起了。</p><button id="replayBtn" class="primary" type="button">再送一次</button></div></section>
<footer><span>一般模式：包裹 → 目的地</span><span>鍵盤 1／2／3 選包裹，Q／W／E 選目的地</span><button id="restartBtn" type="button">↻ 重新開始</button></footer></main><script src="game.js"></script></body></html>
