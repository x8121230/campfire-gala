<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>森林階梯探險隊</title><link rel="stylesheet" href="style.css"></head><body>
<main><aside><p class="eyebrow">FOREST EXPLORERS / 01</p><h1>森林階梯<br>探險隊<span>一路向下，每一步都有驚喜。</span></h1><p class="intro">只控制左右，走出平台邊緣就會落下。看好下一階，帶著橡果向森林深處出發。</p>
<label>探險模式<select id="mode"><option value="child">阿晨晨 · 自主走位</option><option value="baby">妍妍 · 寬平台慢速</option></select></label><label>選擇路線<select id="course"><option value="grass">青草階梯 · 30 層</option><option value="mixed">奇妙森林 · 30 層</option><option value="endless">彩虹無盡 · 混合地形</option></select></label>
<button id="start" class="primary">開始探險 →</button><div class="tools"><button id="pause">暫停</button><button id="sound" aria-pressed="true">音效：開</button></div>
<section class="legend"><h2>森林裡的落腳點</h2><p>🌱 青草　安心落腳</p><p>🍄 蘑菇　輕輕彈起</p><p>🍃 葉子　1.5 秒後捲起</p><p>🌊 小溪　順流漂移</p><p>🍯 蜂蜜　慢慢拔腳</p></section><p class="small">← → 或 A / D 移動 · 空白鍵魔法 · P 暫停<br>無死亡、無扣分；跌落由雲朵接回。<br>v0.1 獨立手感測試版</p></aside>
<section class="play"><div class="hud"><div><small>探索深度</small><strong id="depth">0 層</strong></div><div><small>橡果</small><strong id="nuts">0</strong></div><div><small>連續落地</small><strong id="combo">0</strong></div></div><div class="stage"><canvas id="canvas" width="600" height="800" aria-label="森林下樓梯遊戲，使用左右按鍵移動"></canvas><div class="overlay" id="overlay"><div><p id="symbol">🌱</p><h2 id="title">準備好向下探索了嗎？</h2><p id="message">從平台邊緣走出去，落到下一階。</p><button class="primary" id="continue">出發！</button></div></div><div id="toast" role="status"></div></div><div class="controls"><button id="left" aria-label="向左移動">◀</button><button id="magic">🌈 妍妍魔法</button><button id="right" aria-label="向右移動">▶</button></div></section></main><script src="engine.js"></script><script src="game.js"></script></body></html>
