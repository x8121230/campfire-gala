<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>彩虹橋修理隊 v0.1</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-shell" aria-label="彩虹橋修理隊遊戲">
    <header class="topbar">
      <div class="title-wrap"><span class="rainbow">◒</span><h1>彩虹橋修理隊</h1><span class="version">v0.1 DEMO</span></div>
      <div class="controls">
        <button id="toddlerBtn" type="button" aria-pressed="false">👶 幼幼模式</button>
        <button id="slowBtn" type="button" aria-pressed="false">🐢 慢慢玩</button>
        <button id="hintBtn" type="button" aria-pressed="false">✨ 提示</button>
        <button id="soundBtn" type="button" aria-pressed="true">🔊 音效：開</button>
        <button id="pauseBtn" type="button">⏸ 暫停</button>
      </div>
    </header>

    <section class="stage-wrap">
      <canvas id="game" width="960" height="540" tabindex="0" aria-label="選擇正確的彩虹磚，補回橋上的空格"></canvas>
      <div class="hud">
        <div class="pill" id="stageText">第一階段：照著補</div>
        <div class="progress"><span id="progressBar"></span></div>
        <div class="pill">橋梁 <strong id="roundText">1 / 12</strong></div>
      </div>

      <div id="startPanel" class="panel show">
        <div class="mascot">🌈</div>
        <h2>把彩虹橋補完整！</h2>
        <div class="howto">
          <div><span>👀</span><b>看看橋面</b></div>
          <div><span>🧩</span><b>找出規律</b></div>
          <div><span>☝️</span><b>點彩虹磚</b></div>
        </div>
        <p>每種顏色都有自己的圖案，選錯也能再試。</p>
        <button id="startBtn" class="primary" type="button">開始修彩虹橋</button>
      </div>

      <div id="stagePanel" class="panel compact" aria-hidden="true">
        <div id="stageIcon" class="mascot">🎨</div><h2 id="stageTitle"></h2><p id="stageHelp"></p>
        <button id="stageBtn" class="primary" type="button">開始這一段</button>
      </div>
      <div id="pausePanel" class="panel compact" aria-hidden="true">
        <div class="mascot">☁️</div><h2>休息一下</h2><p>彩虹橋會等你回來。</p>
        <button id="resumeBtn" class="primary" type="button">繼續修理</button>
      </div>
      <div id="finishPanel" class="panel compact" aria-hidden="true">
        <div class="mascot">⭐</div><h2>彩虹橋全部修好了！</h2><p>每一道規律都被你找出來了。</p>
        <button id="replayBtn" class="primary" type="button">再修一次</button>
      </div>
    </section>

    <footer><span>點擊選項，也可按鍵盤 1／2／3</span><span>選錯只會變成小水滴，可以馬上再試</span><button id="restartBtn" type="button">↻ 重新開始</button></footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
