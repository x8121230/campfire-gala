<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>小雨滴回家 v0.1</title><link rel="stylesheet" href="styles.css"></head>
<body>
<main class="game-shell" aria-label="小雨滴回家遊戲">
  <header class="topbar">
    <div class="title-wrap"><span class="drop">◆</span><h1>小雨滴回家</h1><span class="version">v0.1 DEMO</span></div>
    <div class="controls">
      <button id="toddlerBtn" type="button" aria-pressed="false">👶 幼幼模式</button>
      <button id="slowBtn" type="button" aria-pressed="false">🐢 慢慢玩</button>
      <button id="hintBtn" type="button" aria-pressed="false">✨ 提示</button>
      <button id="soundBtn" type="button" aria-pressed="true">🔊 音效：開</button>
      <button id="pauseBtn" type="button">⏸ 暫停</button>
    </div>
  </header>
  <section class="stage-wrap">
    <canvas id="game" width="960" height="540" tabindex="0" aria-label="點選相鄰的雲格，幫小雨滴走到終點"></canvas>
    <div class="hud"><div class="pill" id="stageText">第一階段：跟著雲路</div><div class="progress"><span id="progressBar"></span></div><div class="pill">路線 <strong id="roundText">1 / 12</strong></div></div>
    <div class="side-actions"><button id="undoBtn" type="button">↶ 退一步</button></div>

    <div id="startPanel" class="panel show"><div class="mascot">💧</div><h2>幫小雨滴找到回家的路！</h2><div class="howto"><div><span>☁️</span><b>找相鄰雲格</b></div><div><span>☝️</span><b>點一下前進</b></div><div><span>🌷</span><b>走到目的地</b></div></div><p>走錯可以原路回來，完全沒有時間限制。</p><button id="startBtn" class="primary" type="button">開始找路</button></div>
    <div id="stagePanel" class="panel compact" aria-hidden="true"><div id="stageIcon" class="mascot">☁️</div><h2 id="stageTitle"></h2><p id="stageHelp"></p><button id="stageBtn" class="primary" type="button">開始這一段</button></div>
    <div id="pausePanel" class="panel compact" aria-hidden="true"><div class="mascot">💤</div><h2>先休息一下</h2><p>小雨滴會停在原地等你。</p><button id="resumeBtn" class="primary" type="button">繼續找路</button></div>
    <div id="finishPanel" class="panel compact" aria-hidden="true"><div class="mascot">🌦️</div><h2>所有小雨滴都回家了！</h2><p>花園、池塘和水車都充滿活力。</p><button id="replayBtn" class="primary" type="button">再玩一次</button></div>
  </section>
  <footer><span>點相鄰雲格前進；走錯可直接點上一格或按「退一步」</span><span>單向風只能順著箭頭走</span><button id="restartBtn" type="button">↻ 重新開始</button></footer>
</main><script src="game.js"></script>
</body></html>
