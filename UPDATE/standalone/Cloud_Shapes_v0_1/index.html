<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>雲朵變變變 v0.1</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-shell" aria-label="雲朵變變變遊戲">
    <header class="topbar">
      <div class="title-wrap"><span class="cloud-mark">☁</span><h1>雲朵變變變</h1><span class="version">v0.1 DEMO</span></div>
      <div class="controls">
        <button id="toddlerBtn" type="button" aria-pressed="false">👶 幼幼模式</button>
        <button id="hintBtn" type="button" aria-pressed="false">✨ 提示</button>
        <button id="soundBtn" type="button" aria-pressed="true">🔊 音效：開</button>
        <button id="pauseBtn" type="button">⏸ 暫停</button>
      </div>
    </header>

    <section class="stage-wrap">
      <canvas id="game" width="960" height="540" tabindex="0" aria-label="拖曳正確的雲塊放進大雲的缺口"></canvas>
      <div class="hud">
        <div class="pill" id="stageText">第一階段：找形狀</div>
        <div class="progress"><span id="progressBar"></span></div>
        <div class="pill">題目 <strong id="roundText">1 / 12</strong></div>
      </div>

      <div id="startPanel" class="panel show">
        <div class="mascot">🌬️</div>
        <h2>幫大雲補回缺少的一塊！</h2>
        <div class="howto">
          <div><span>👀</span><b>看看缺口</b></div>
          <div><span>☁️</span><b>選小雲塊</b></div>
          <div><span>🫳</span><b>拖進缺口</b></div>
        </div>
        <p>放錯也沒關係，小雲會回來讓你再試一次。</p>
        <button id="startBtn" class="primary" type="button">開始變雲朵</button>
      </div>

      <div id="stagePanel" class="panel compact" aria-hidden="true">
        <div id="stageIcon" class="mascot">🔷</div>
        <h2 id="stageTitle"></h2>
        <p id="stageHelp"></p>
        <button id="stageBtn" class="primary" type="button">開始這一段</button>
      </div>

      <div id="pausePanel" class="panel compact" aria-hidden="true">
        <div class="mascot">☁️</div><h2>雲朵先休息</h2><p>準備好再繼續。</p>
        <button id="resumeBtn" class="primary" type="button">繼續遊戲</button>
      </div>

      <div id="finishPanel" class="panel compact" aria-hidden="true">
        <div class="mascot">🌈</div><h2>十二朵雲都完成了！</h2>
        <p>兔子、鯨魚、城堡和星星都回到天空了。</p>
        <button id="replayBtn" class="primary" type="button">再玩一次</button>
      </div>
    </section>

    <footer>
      <span>拖曳操作，也可按鍵盤 1／2／3</span>
      <span id="modeTip">幼幼模式：點一下就會自動放置</span>
      <button id="restartBtn" type="button">↻ 重新開始</button>
    </footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
