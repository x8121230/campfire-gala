<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>貓頭鷹的熱氣球 v0.1</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="shell">
  <header>
    <div><p class="eyebrow">雲端島嶼 · 形狀工坊</p><h1>貓頭鷹的熱氣球</h1></div>
    <div class="toolbar" aria-label="遊戲設定">
      <button id="toddlerBtn" aria-pressed="false">幼幼模式：關</button>
      <button id="slowBtn" aria-pressed="false">慢慢玩：關</button>
      <button id="soundBtn" aria-pressed="true">音效：開</button>
      <button id="pauseBtn">暫停</button><button id="restartBtn">重玩</button>
    </div>
  </header>
  <section class="status" aria-live="polite">
    <div><span id="chapter">第一站</span><strong id="levelName">晨光號</strong></div>
    <p id="instruction">把零件拖到一樣形狀的虛線框</p>
    <div class="progress"><span id="progressFill"></span></div>
    <button id="hintBtn">提示一個零件</button>
  </section>
  <section class="game-wrap">
    <canvas id="game" width="960" height="540" aria-label="熱氣球形狀配對遊戲區"></canvas>
    <div id="pauseOverlay" class="overlay hidden"><div class="card"><span>☁️</span><h2>在雲朵上休息</h2><button id="resumeBtn">繼續組裝</button></div></div>
    <div id="finishOverlay" class="overlay hidden"><div class="card"><span>🎈</span><h2>十二艘熱氣球都出發了！</h2><p>小貓頭鷹飛遍了雲端島嶼。</p><button id="playAgainBtn">再玩一次</button></div></div>
  </section>
  <nav id="levelPicker" class="levels" aria-label="選擇關卡"></nav>
  <p class="help">拖曳零件配對；幼幼模式只要點一下零件。所有關卡開放，點錯不扣分。</p>
</main>
<script src="game.js"></script>
</body>
</html>
