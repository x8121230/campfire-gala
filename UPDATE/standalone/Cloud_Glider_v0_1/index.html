<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>雲端滑翔隊 v0.1</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-shell" aria-label="雲端滑翔隊遊戲">
    <header class="topbar">
      <div class="title-wrap">
        <span class="island-dot" aria-hidden="true"></span>
        <h1>雲端滑翔隊</h1>
        <span class="version">v0.1 DEMO</span>
      </div>
      <div class="controls" aria-label="遊戲設定">
        <button id="slowBtn" type="button" aria-pressed="false">🐢 慢慢玩</button>
        <button id="hintBtn" type="button" aria-pressed="true">✨ 提示：開</button>
        <button id="soundBtn" type="button" aria-pressed="true">🔊 音效：開</button>
        <button id="pauseBtn" type="button">⏸ 暫停</button>
      </div>
    </header>

    <section class="stage-wrap">
      <canvas id="game" width="960" height="540" tabindex="0" aria-label="按住畫面或空白鍵讓滑翔器上升，放開則下降"></canvas>
      <div id="hud" class="hud" aria-live="polite">
        <div class="hud-pill">星羽 <strong id="featherText">0 / 12</strong></div>
        <div class="hud-pill">風圈 <strong id="ringText">0 / 9</strong></div>
        <div class="progress" aria-label="飛行進度"><span id="progressBar"></span></div>
      </div>

      <div id="startPanel" class="panel show">
        <div class="mascot" aria-hidden="true">☁️</div>
        <h2>跟著風，飛到下一座浮島！</h2>
        <div class="howto">
          <div><span class="gesture">☝️</span><b>按住</b><small>往上飛</small></div>
          <div><span class="gesture">🖐️</span><b>放開</b><small>慢慢下降</small></div>
          <div><span class="gesture">⭕</span><b>穿風圈</b><small>收集星羽</small></div>
        </div>
        <p>撞到雲也沒關係，只會輕輕彈開。</p>
        <button id="startBtn" class="primary" type="button">開始飛行</button>
      </div>

      <div id="pausePanel" class="panel compact" aria-hidden="true">
        <div class="mascot" aria-hidden="true">😴</div>
        <h2>休息一下</h2>
        <p>準備好再繼續飛。</p>
        <button id="resumeBtn" class="primary" type="button">繼續飛行</button>
      </div>

      <div id="finishPanel" class="panel compact" aria-hidden="true">
        <div class="mascot" aria-hidden="true">🌈</div>
        <h2>抵達彩虹浮島！</h2>
        <p id="finishText"></p>
        <button id="replayBtn" class="primary" type="button">再飛一次</button>
      </div>
    </section>

    <footer>
      <span>滑鼠／觸控：按住畫面</span>
      <span>鍵盤：空白鍵或 ↑</span>
      <button id="restartBtn" type="button">↻ 重新開始</button>
    </footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
