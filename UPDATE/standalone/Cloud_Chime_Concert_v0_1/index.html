<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>雲端風鈴音樂會 v0.1</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="shell">
  <header><div><p class="eyebrow">雲端島嶼 · 色彩音樂</p><h1>雲端風鈴音樂會</h1></div><div class="toolbar" aria-label="遊戲設定"><button id="toddlerBtn" aria-pressed="false">幼幼模式：關</button><button id="slowBtn" aria-pressed="false">慢慢玩：關</button><button id="soundBtn" aria-pressed="true">音效：開</button><button id="pauseBtn">暫停</button><button id="restartBtn">重玩</button></div></header>
  <section class="status" aria-live="polite"><div><span id="chapter">第一樂章</span><strong id="levelName">彩霞問候</strong></div><p id="instruction">請小鳥先示範，再照順序敲風鈴</p><div class="progress"><span id="progressFill"></span></div><button id="demoBtn">聽小鳥示範</button></section>
  <section class="game-wrap"><canvas id="game" width="960" height="540" aria-label="五色水晶風鈴記憶遊戲區"></canvas><div id="pauseOverlay" class="overlay hidden"><div class="card"><span>🎵</span><h2>音樂先休息一下</h2><button id="resumeBtn">繼續演奏</button></div></div><div id="finishOverlay" class="overlay hidden"><div class="card"><span>🐦</span><h2>十二首雲端樂曲完成了！</h2><p>小鳥為你跳了一支彩虹舞。</p><button id="playAgainBtn">再演奏一次</button></div></div></section>
  <nav id="levelPicker" class="levels" aria-label="選擇關卡"></nav><p class="help">先按「聽小鳥示範」，再依序點風鈴。幼幼模式可自由演奏；答錯沒有懲罰。</p>
</main><script src="game.js"></script></body></html>
